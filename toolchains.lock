# toolchains.lock — content-addressed pinning for every toolchain artifact
# scripts/setup.sh downloads. Format (whitespace-separated columns):
#
#   name  sha256  size_bytes  resolved_tag  url
#
# `name` matches the local cache filename in $DL/. setup.sh's fetch() verifies
# sha256 after each download; mismatch aborts with a clear message.
#
# Why content-addressed: the 2026-05-30 esp-idf-dlang re-upload reused the
# same release tag (`xtensa-toolchain`) but bumped LDC's version (1.42-git →
# 1.42.0) AND its LLVM (21.1.3 → 22.1.4) — silently moving the toolchain from
# the LLVM-21 cluster to the LLVM-22 cluster (changing which cross-language
# LTO pairs link). Tag-pinning didn't catch it; hash-pinning does. See
# HANDOFF.md §"Lock-file motivation".
#
# Update procedure when a fork bumps a tag:
#   1. Delete the cached tarball:   rm $DL/<name>
#   2. Re-run setup.sh — it fetches the new bytes and aborts on mismatch.
#   3. Recompute sha256:            sha256sum $DL/<name>
#   4. Update the row below in a SINGLE commit titled
#      "toolchains.lock: <name> bumped (<old-version> → <new-version>)".
#      The commit IS the audit log entry — a real engineering event.

